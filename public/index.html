      (()=>{try{const PHASES={live:{title:'Moonline Live',msg:'Signal clear. Compartments are open.',cta:'Enter Platform',cls:'live'},pre:{title:'Pre-Boarding',msg:'Route opens at 19:00 Bangladesh time.',cta:'Wait on Platform',cls:'pre'},off:{title:'Off Platform',msg:'Platform is quiet. Return at 19:00.',cta:'View Platform',cls:'off'}};const pad=n=>String(n).padStart(2,'0');function bdParts(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()).reduce((a,p)=>(a[p.type]=p.value,a),{});return {h:+parts.hour,m:+parts.minute,s:+parts.second,time:`${parts.hour}:${parts.minute}:${parts.second}`}}function phase(){const {h}=bdParts();return h>=19||h<5?'live':h>=17?'pre':'off'}function secsToTarget(){const {h,m,s}=bdParts();let target;if(h>=19||h<5)target=5;else target=19;let now=h*3600+m*60+s,t=target*3600;if(t<=now)t+=86400;return t-now}function fmtSec(x){const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return [h,m,s].map(pad)}function ensure(){document.body.classList.toggle('ae-home',location.pathname==='/'||location.pathname==='');if(!document.body.classList.contains('ae-home'))return;const root=document.getElementById('root');if(!root||document.getElementById('ae-opening'))return;const el=document.createElement('section');el.id='ae-opening';el.className='ae-opening';el.innerHTML=`<div class="ae-grid"><div class="ae-terminal"><div class="ae-kicker"><span class="ae-dot"></span><span class="ae-phase-label">Platform 01 · Bangladesh Time</span></div><h1 class="ae-title">Aagontuk <em>Express</em></h1><div class="ae-morph"><span class="main">Moonline Live</span><span class="ghost">Pre-Boarding</span></div><p class="ae-line">A quiet platform for anonymous chats, confessions, songs, and table games.</p><div class="ae-actions"><a class="ae-btn primary" href="/board">Enter Platform</a><a class="ae-btn secondary" href="/confes
